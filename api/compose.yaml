services:
  postgres-scout-beam:
    image: postgres:17
    container_name: postgres-scout-beam
    restart: unless-stopped
    environment:
      POSTGRES_DB: scout_beam
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
    volumes:
      - postgres-scout-beam-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d scout_beam"]
      interval: 5s
      timeout: 5s
      retries: 10

  # `make test` only: durability off and data on a tmpfs, kept apart so it cannot cost a dev row.
  postgres-scout-beam-test:
    image: postgres:17
    container_name: postgres-scout-beam-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: scout_beam_test
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5437:5432"
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c max_connections=200
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d scout_beam_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-scout-beam-data:
